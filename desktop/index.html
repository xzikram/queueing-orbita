<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orbita Queue Caller</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Titlebar (Lavender Background, Mimicking Mockup) -->
  <div class="titlebar">
    <div class="titlebar-title">
      <span class="titlebar-icon">🔔</span>
      <span class="titlebar-text">Orbita Queue</span>
    </div>
    <div class="titlebar-controls">
      <button id="minBtn" class="control-btn" title="Minimize">−</button>
    </div>
  </div>

  <div class="app-container">

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="screen active">
      <div class="login-box">
        <div class="brand">
          <div class="brand-title">Orbita Queue</div>
          <div class="brand-sub">JEC ORBITA @ Makassar</div>
        </div>
        
        <form id="loginForm">
          <div class="form-group">
            <label>URL Server API</label>
            <input type="text" id="serverUrl" value="http://192.168.40.131:3001" placeholder="http://192.168.40.131:3001" required>
          </div>
          <div class="form-group">
            <label>Email Petugas</label>
            <input type="email" id="email" placeholder="admin@orbita.com" required>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="••••••••" required>
          </div>
          <button type="submit" id="loginBtn" class="btn btn-primary btn-block">
            🔑 Login Operator
          </button>
        </form>
        <div id="loginError" class="error-msg"></div>
      </div>
    </div>

    <!-- CALLER WIDGET SCREEN -->
    <div id="callerScreen" class="screen">
      
      <!-- Card 1: Unit Selector Box (Dark Select) -->
      <div class="unit-select-card">
        <span class="unit-label">🔄 Unit:</span>
        <select id="unitSelect" class="dark-unit-select">
          <option value="ADMISSION">🏢 Admisi</option>
          <option value="CASHIER">💳 Kasir</option>
        </select>
      </div>

      <!-- Card 2: Loket & User Info Bar -->
      <div class="loket-bar-card">
        <div class="loket-info">
          <div class="loket-title">📍 <strong id="currentCounterName">Loket</strong></div>
          <div class="loket-sub">Halo, <span id="userName">Administrator</span></div>
        </div>
        <div class="loket-pills">
          <button id="toggleCounterStatusBtn" class="pill-btn pill-active">🟢 Aktif</button>
          <button id="changeCounterBtn" class="pill-btn pill-change">🔄 Ganti</button>
          <button id="logoutBtn" class="pill-btn pill-logout">🚪 Keluar</button>
        </div>
      </div>

      <!-- Card 3: Tab Navigation Bar (Admisi vs Kasir) -->
      <div class="tab-pill-bar">
        <button id="tabAdmisi" class="tab-pill active">
          📋 Admisi (<span id="countAdmisi">0</span>)<span id="admisiDot" class="red-dot" style="display:none;"></span>
        </button>
        <button id="tabKasir" class="tab-pill">
          💳 Kasir (<span id="countKasir">0</span>)
        </button>
      </div>

      <!-- MAIN CONTENT CONTAINER (STATE DEPENDENT) -->
      <div class="main-content-wrapper">

        <!-- STATE 1: ACTIVE CALL / SERVING STATE (MOCKUP 1) -->
        <div id="activeStateContainer" class="active-call-card" style="display: none;">
          <div class="active-header">
            <span id="activeStatusLabel" class="status-green">🟢 DILAYANI</span>
            <span id="activeTimerClock" class="clock-timer">⏱️ 12:05</span>
          </div>

          <div id="activeTicketDisplay" class="ticket-number-big">
            <span id="ticketPrefix" class="t-prefix">B</span><span id="ticketNum" class="t-num">002</span>
          </div>
          <div id="activePatientType" class="patient-type-label">Umum</div>

          <!-- Inner Form Box (Matching Mockup 1) -->
          <div id="innerFormBox" class="inner-form-box">
            <div class="form-row">
              <label>👤 Dokter Tujuan *</label>
              <select id="doctorSelect" class="form-select-custom">
                <option value="">-- Pilih Dokter --</option>
              </select>
            </div>
            
            <div class="form-row flex-row">
              <label>🎟️ No. Tiket Dokter:</label>
              <input type="text" id="doctorTicketNoInput" class="form-input-custom text-orange" placeholder="MA020">
            </div>

            <div class="form-row">
              <label>Tujuan Selanjutnya *</label>
              <select id="nextUnitSelect" class="form-select-custom">
                <option value="ASSESSMENT">📋 Pengkajian</option>
                <option value="DOCTOR">🩺 Dokter (Poli)</option>
                <option value="BDR">🩸 BDR</option>
                <option value="CASHIER">💳 Kasir</option>
                <option value="PHARMACY">💊 Farmasi</option>
              </select>
            </div>
          </div>
        </div>

        <!-- STATE 2 & 3: IDLE / EMPTY STATE BOX (MOCKUP 2 & 3) -->
        <div id="idleStateContainer" class="idle-card">
          <div class="empty-state-text">Antrean Kosong</div>
        </div>

      </div>

      <!-- BOTTOM CONTROL BAR CONTAINER (STATE DEPENDENT) -->
      <div class="bottom-control-container">

        <!-- STATE 1 CONTROLS: 4 GRID ACTION BUTTONS (MOCKUP 1) -->
        <div id="activeControlsGrid" class="controls-grid-4" style="display: none;">
          <button id="finishBtn" class="action-btn finish-btn" title="Selesai">✅</button>
          <button id="recallBtn" class="action-btn recall-btn" title="Panggil Ulang">📢</button>
          <button id="holdBtn" class="action-btn hold-btn" title="Hold / Pause">⏸️</button>
          <button id="cancelBtn" class="action-btn cancel-btn" title="Batal / Drop">❌</button>
        </div>

        <!-- STATE 2 CONTROLS: REFRESH & AMBIL TIKET BARU (MOCKUP 2) -->
        <div id="idleControlsBox" class="idle-controls-box">
          <button id="refreshBtn" class="btn-action-full btn-refresh">
            🔄 Refresh Antrean
          </button>
          <button id="openNewTicketBtn" class="btn-action-full btn-new-ticket">
            🎟️ Ambil Tiket Baru
          </button>
        </div>

        <!-- STATE 3 CONTROLS: REFRESH & QUICK CATEGORY BUTTONS (MOCKUP 3 - ADMISI: A-D, KASIR: G-H) -->
        <div id="manualControlsBox" class="manual-controls-box" style="display: none;">
          <button id="refreshBtn2" class="btn-action-full btn-refresh mb-2">
            🔄 Refresh Antrean
          </button>
          <div id="categoryGrid" class="category-grid">
            <!-- Dynamic Category Buttons (Rendered by JS) -->
          </div>
        </div>

      </div>

    </div>

  </div>

  <!-- MODAL: COUNTER PICKER -->
  <div id="counterModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>📍 Pilih Loket Jaga</h3>
        <button id="closeCounterModalBtn" class="close-modal">&times;</button>
      </div>
      <div class="form-group">
        <label>Pilih Loket Tempat Anda Bertugas:</label>
        <select id="modalCounterSelect" class="modal-select-custom"></select>
      </div>
      <button id="saveCounterBtn" class="btn btn-primary btn-block">Simpan & Mulai Jaga</button>
    </div>
  </div>

  <!-- MODAL: CANCEL REASON -->
  <div id="cancelModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 style="color: #ef4444;">❌ Batalkan / Drop Antrean</h3>
        <button id="closeCancelModalBtn" class="close-modal">&times;</button>
      </div>
      <form id="cancelForm">
        <div class="form-group">
          <label>Alasan Pembatalan *</label>
          <input type="text" id="cancelReasonInput" class="select-input" placeholder="Contoh: Salah panggil / Pasien batal" required>
        </div>
        <button type="submit" class="btn btn-danger btn-block">💾 Simpan Pembatalan</button>
      </form>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
